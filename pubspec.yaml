name: notes_app
description: A Flutter Notes app using BLoC and SQLite (sqflite), styled to match the approved Android mockup.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5

  # Local storage
  # sqflite stores the notes themselves (see DatabaseService / NoteRepository).
  # shared_preferences is kept only for the single dark-mode boolean —
  # a whole SQLite table would be overkill for one flag.
  sqflite: ^2.4.0
  path: ^1.9.1
  shared_preferences: ^2.2.2

  # Fonts (Sora + Inter, matching the mockup) — all applied through AppTheme
  google_fonts: ^6.2.1

  # Utilities
  uuid: ^4.3.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
