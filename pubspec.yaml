name: notes_app
description: A Flutter Notes app using BLoC and SQLite (sqflite), styled to match the approved Android mockup.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5

  # Local storage
  sqflite: ^2.4.0
  path: ^1.9.1
  shared_preferences: ^2.2.2

  # Fonts & Utilities
  google_fonts: ^8.2.1
  uuid: ^4.3.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_icon.jpg

# Launcher Icon Config (White Background)
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.jpg"
  min_sdk_android: 21

# Native Splash Screen Config (White Background)
flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/app_icon.jpg"

  # Android 12 specific simple setup
  android_12:
    icon_background_color: "#FFFFFF"